services:
  - type: web
    name: shopcrew
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LLM_PROVIDER
        value: replay
      - key: PAYPAL_ENV
        value: sandbox
      - key: DEMO_SEED
        value: "42"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AG_GRID_LICENSE_KEY
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false

# Do not add the free Postgres database until 15 Nov 2026.
# Free databases expire 30 days after creation. Created on 15 or 16 Nov,
# expiry lands after judging (1–15 Dec). Until then the app uses PGlite
# and reseeds on boot. Merge docs/render-postgres.yaml on that date.
