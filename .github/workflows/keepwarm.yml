name: keepwarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  warm:
    if: vars.KEEPWARM == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Render service
        run: curl --fail --retry 5 --retry-delay 15 --max-time 120 "${{ vars.DEMO_URL }}/healthz"
